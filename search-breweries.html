<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Search for breweries with iBrew! Explore our extensive brewery database to find local gems and popular favorites. Use filters to narrow down your search and discover new beer experiences near you!"
    />

    <!-- Favicon -->
    <link rel="icon" href="./assets/icons/favicon.ico" type="image/x-icon" />

    <!-- CSS -->
    <!-- Shared layout -->
    <link rel="stylesheet" href="css/layout/layout.css" />
    <link rel="stylesheet" href="css/layout/navbar.css" />
    <link rel="stylesheet" href="css/layout/footer.css" />

    <!-- Shared utilities -->
    <link rel="stylesheet" href="css/utilities/layout.css" />
    <link rel="stylesheet" href="css/utilities/outline.css" />
    <link rel="stylesheet" href="css/utilities/link.css" />
    <link rel="stylesheet" href="css/utilities/button.css" />
    <link rel="stylesheet" href="css/utilities/modal.css" />
    <link rel="stylesheet" href="css/utilities/animation.css" />
    <link rel="stylesheet" href="css/utilities/skeleton.css" />

    <!-- Page styles -->
    <link rel="stylesheet" href="css/search-breweries/layout.css" />
    <link rel="stylesheet" href="css/search-breweries/filter.css" />
    <link rel="stylesheet" href="css/search-breweries/search-results.css" />
    <link rel="stylesheet" href="css/search-breweries/brewery.css" />

    <!-- Browser tab title -->
    <title>iBrew - Find Breweries</title>

    <!-- Font Awesome Icons -->
    <script
      src="https://kit.fontawesome.com/8700864f26.js"
      crossorigin="anonymous"
      defer
    ></script>
  </head>
  <body>
    <!-- Navigation Bar -->
    <nav aria-label="Primary navigation">
      <div class="nav__row">
        <a
          class="light-outline-on-focus"
          href="index.html"
          aria-label="iBrew home"
        >
          <figure class="nav__logo--wrapper animate-slide-in-left">
            <img
              src="./assets/images/brand/logo.svg"
              alt="iBrew Logo"
              class="nav__logo"
            />
          </figure>
        </a>

        <!-- Navigation Links -->
        <ul class="nav__links align-items-center animate-slide-in-right">
          <li>
            <a href="index.html" class="link text-light" aria-current="page"
              >Home</a
            >
          </li>
          <li>
            <a href="random-brewery.html" class="link text-light"
              >Random Brewery</a
            >
          </li>
          <li>
            <a
              href="search-breweries.html"
              class="link--primary btn btn-light-primary btn-light-primary-hover text-light"
              >Find Breweries</a
            >
          </li>

          <li>
            <button
              class="btn-transparent nav__theme-toggle-btn light-outline-on-focus"
              type="button"
              aria-label="Toggle light/dark theme"
            >
              <i
                class="text-light fa-solid fa-circle-half-stroke nav__theme-btn"
                aria-hidden="true"
              ></i>
            </button>
          </li>
        </ul>

        <button
          class="btn-transparent nav__menu-btn light-outline-on-focus"
          type="button"
          aria-label="Open navigation menu"
          aria-expanded="false"
          aria-controls="mobile-navigation"
        >
          <i
            class="fa-solid fa-bars animate-slide-in-right"
            aria-hidden="true"
          ></i>
        </button>
      </div>

      <!-- Collapsible Navigation Links -->
      <div class="nav__links--expandable" id="mobile-navigation">
        <ul class="nav__links--expandable-content">
          <li>
            <a href="index.html" class="link text-light" aria-current="page"
              >Home</a
            >
          </li>
          <li>
            <a href="random-brewery.html" class="link text-light"
              >Random Brewery</a
            >
          </li>

          <li>
            <a
              href="search-breweries.html"
              class="link--primary btn btn-light-primary btn-light-primary-hover text-light"
              >Find Breweries</a
            >
          </li>

          <li>
            <button
              class="btn-transparent nav__theme-toggle-btn light-outline-on-focus"
              type="button"
              aria-label="Toggle light/dark theme"
            >
              <i
                class="text-light fa-solid fa-circle-half-stroke nav__theme-btn"
                aria-hidden="true"
              ></i>
            </button>
          </li>
        </ul>
      </div>
    </nav>

    <!-- Modal -->
    <dialog
      id="brewery-dialog"
      class="modal"
      autofocus
      aria-labelledby="brewery-dialog-title"
    ></dialog>

    <!-- Main Content -->
    <main>
      <section class="section" id="search-results-section">
        <div class="search__wrapper">
          <h1 class="search__title text-dark">Find Breweries</h1>

          <form class="search__form">
            <label class="sr-only" for="brewery-search">Search breweries</label>
            <i
              class="search__icon fa-solid fa-magnifying-glass"
              aria-hidden="true"
            ></i>
            <input
              id="brewery-search"
              class="search__input"
              type="text"
              placeholder="Search for breweries..."
            />
            <button
              class="search__btn btn btn-dark-primary btn-dark-primary-hover"
            >
              Search
            </button>
          </form>
        </div>

        <div class="search-results__wrapper">
          <div class="search-results-filter__wrapper">
            <h3
              class="search-results-filter__count animate-slide-in-left text-dark"
              aria-live="polite"
            >
              Search Results
            </h3>
            <label class="sr-only" for="search-results-sort"
              >Sort search results</label
            >
            <select
              id="search-results-sort"
              class="search-results-filter__dropdown animate-slide-in-right"
            >
              <option value="">Sort By</option>
              <option value="name-asc">Name (A-Z)</option>
              <option value="name-desc">Name (Z-A)</option>
            </select>
          </div>

          <ul class="search-results__list"></ul>

          <div class="search-results__expand-btn--wrapper">
            <button
              class="btn btn-dark-primary btn-dark-primary-hover search-results__expand-btn"
              type="button"
            >
              Load More
            </button>
          </div>
        </div>
      </section>
    </main>

    <!-- Footer -->
    <footer>
      <div class="footer__wrapper animate-pop-in">
        <a
          class="light-outline-on-focus"
          href="index.html"
          aria-label="iBrew home"
        >
          <figure class="footer__logo--wrapper">
            <img src="./assets/images/brand/logo.svg" alt="" class="img" />
          </figure>
        </a>

        <ul class="footer__links">
          <li><a href="index.html" class="link text-light">Home</a></li>
          <li>
            <a href="random-brewery.html" class="link text-light"
              >Random Brewery</a
            >
          </li>
          <li>
            <a href="search-breweries.html" class="link text-light"
              >Find Breweries</a
            >
          </li>
        </ul>

        <p class="text-light">&copy; 2026 iBrew. All rights reserved.</p>
        <p class="text-light">
          Created by
          <a
            class="text-light light-outline-on-focus"
            href="https://www.huadylan.com"
            target="_blank"
            rel="noopener noreferrer"
            >Dylan Hua</a
          >
        </p>
      </div>
    </footer>

    <!-- Scripts -->
    <script src="scripts/api/brewery.js"></script>
    <script src="scripts/utilities.js"></script>
    <script
      type="module"
      src="scripts/search-breweries/search-breweries.js"
    ></script>
    <script src="scripts/map.js"></script>
  </body>
</html>
