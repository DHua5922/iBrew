<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Discover a random brewery with iBrew! Explore new beer flavors and brewery locations with just a click. Find your next favorite brew today!"
    />

    <!-- Favicon -->
    <link rel="icon" href="./assets/icons/favicon.ico" type="image/x-icon" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&display=swap"
      rel="stylesheet"
    />

    <!-- CSS -->
    <!-- Shared layout -->
    <link rel="stylesheet" href="css/layout/layout.css" />
    <link rel="stylesheet" href="css/layout/navbar.css" />
    <link rel="stylesheet" href="css/layout/footer.css" />

    <!-- Shared utilities -->
    <link rel="stylesheet" href="css/utilities/layout.css" />
    <link rel="stylesheet" href="css/utilities/outline.css" />
    <link rel="stylesheet" href="css/utilities/link.css" />
    <link rel="stylesheet" href="css/utilities/button.css" />
    <link rel="stylesheet" href="css/utilities/animation.css" />
    <link rel="stylesheet" href="css/utilities/skeleton.css" />

    <!-- Page styles -->
    <link rel="stylesheet" href="css/random-brewery.css" />

    <!-- Browser tab title -->
    <title>iBrew - Random Brewery</title>

    <!-- Font Awesome Icons -->
    <script
      src="https://kit.fontawesome.com/8700864f26.js"
      crossorigin="anonymous"
      defer
    ></script>
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to main content</a>

    <!-- Navigation Bar -->
    <nav aria-label="Primary navigation">
      <div class="nav__row">
        <a
          class="light-outline-on-focus"
          href="index.html"
          aria-label="iBrew home"
        >
          <figure class="nav__logo--wrapper animate-slide-in-left">
            <img
              src="./assets/images/brand/logo.svg"
              alt="iBrew Logo"
              class="nav__logo"
            />
          </figure>
        </a>

        <!-- Navigation Links -->
        <ul class="nav__links align-items-center animate-slide-in-right">
          <li>
            <a href="index.html" class="link text-light">Home</a>
          </li>
          <li>
            <a
              href="random-brewery.html"
              class="link text-light"
              aria-current="page"
              >Random Brewery</a
            >
          </li>
          <li>
            <a
              href="search-breweries.html"
              class="link--primary btn btn-light-primary btn-light-primary-hover text-light"
              >Find Breweries</a
            >
          </li>

          <li>
            <button
              class="btn-transparent nav__theme-toggle-btn light-outline-on-focus"
              type="button"
              aria-label="Toggle light/dark theme"
            >
              <i
                class="text-light fa-solid fa-circle-half-stroke nav__theme-btn"
                aria-hidden="true"
              ></i>
            </button>
          </li>
        </ul>

        <button
          class="btn-transparent nav__menu-btn light-outline-on-focus"
          type="button"
          aria-label="Open navigation menu"
          aria-expanded="false"
          aria-controls="mobile-navigation"
        >
          <i
            class="fa-solid fa-bars animate-slide-in-right"
            aria-hidden="true"
          ></i>
        </button>
      </div>

      <!-- Collapsible Navigation Links -->
      <div class="nav__links--expandable" id="mobile-navigation">
        <ul class="nav__links--expandable-content">
          <li>
            <a href="index.html" class="link text-light">Home</a>
          </li>
          <li>
            <a
              href="random-brewery.html"
              class="link text-light"
              aria-current="page"
              >Random Brewery</a
            >
          </li>

          <li>
            <a
              href="search-breweries.html"
              class="link--primary btn btn-light-primary btn-light-primary-hover text-light"
              >Find Breweries</a
            >
          </li>

          <li>
            <button
              class="btn-transparent nav__theme-toggle-btn light-outline-on-focus"
              type="button"
              aria-label="Toggle light/dark theme"
            >
              <i
                class="text-light fa-solid fa-circle-half-stroke nav__theme-btn"
                aria-hidden="true"
              ></i>
            </button>
          </li>
        </ul>
      </div>
    </nav>

    <!-- Main Content -->
    <main id="main-content">
      <section class="section" id="random-brewery-section">
        <h1 class="brewery__header animate-pop-in text-dark">
          Try This Brewery!
        </h1>

        <div class="brewery__details row">
          <div
            class="animate-slide-in-left"
            id="map"
            role="region"
            aria-label="Brewery location map"
          ></div>
          <div
            class="brewery__description animate-slide-in-right"
            aria-live="polite"
          ></div>
        </div>

        <button
          class="brewery__button--refresh btn btn-dark-primary btn-dark-primary-hover animate-pop-in text-dark"
          type="button"
        >
          Give Me Another Brewery
        </button>
      </section>
    </main>

    <!-- Footer -->
    <footer>
      <div class="footer__wrapper animate-pop-in">
        <a
          class="light-outline-on-focus"
          href="index.html"
          aria-label="iBrew home"
        >
          <figure class="footer__logo--wrapper">
            <img src="./assets/images/brand/logo.svg" alt="" class="img" />
          </figure>
        </a>

        <ul class="footer__links">
          <li><a href="index.html" class="link text-light">Home</a></li>
          <li>
            <a href="random-brewery.html" class="link text-light"
              >Random Brewery</a
            >
          </li>
          <li>
            <a href="search-breweries.html" class="link text-light"
              >Find Breweries</a
            >
          </li>
        </ul>

        <p class="text-light">&copy; 2026 iBrew. All rights reserved.</p>
        <p class="text-light">
          Created by
          <a
            class="text-light light-outline-on-focus"
            href="https://www.huadylan.com"
            target="_blank"
            rel="noopener noreferrer"
            >Dylan Hua</a
          >
        </p>
      </div>
    </footer>

    <!-- Scripts -->
    <script src="scripts/api/brewery.js"></script>
    <script src="scripts/navbar.js"></script>
    <script src="scripts/theme.js"></script>
    <script src="scripts/random-brewery.js"></script>
    <script src="scripts/map.js"></script>
  </body>
</html>
