<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicon -->
    <link rel="icon" href="./assets/favicon.ico" type="image/x-icon" />

    <!-- CSS -->
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/random-brewery.css" />

    <!-- Browser tab title -->
    <title>iBrew - Random Brewery</title>

    <!-- Font Awesome Icons -->
    <script
      src="https://kit.fontawesome.com/8700864f26.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <!-- Modal -->
    <dialog id="my-dialog" class="modal" popover autofocus></dialog>

    <!-- Navigation Bar -->
    <nav>
      <div class="nav__row">
        <figure class="nav__logo--wrapper">
          <img src="./assets/logo.png" alt="iBrew Logo" class="nav__logo" />
        </figure>

        <ul class="nav__links">
          <li><a href="/" class="nav__link text-tertiary">Home</a></li>
          <li>
            <a href="random-brewery.html" class="nav__link text-tertiary"
              >Random Brewery</a
            >
          </li>
          <li>
            <a
              href="search-breweries.html"
              class="nav__link btn btn-primary btn-primary-hover"
              >Find Breweries</a
            >
          </li>
        </ul>
      </div>
    </nav>

    <!-- Main Content -->
    <main>
      <section class="section" id="random-brewery-section">
        <h1 class="brewery__header animate-pop-in">Try This Brewery!</h1>

        <div class="brewery__details row">
          <div class="animate-slide-in-left" id="map"></div>
          <div class="brewery__description animate-slide-in-right"></div>
        </div>

        <button
          class="brewery__button--refresh btn btn-primary animate-pop-in"
          onclick="loadBrewery()"
        >
          Give Me Another Brewery
        </button>
      </section>
    </main>

    <!-- Footer -->
    <footer>
      <div class="footer__wrapper">
        <figure class="footer__logo--wrapper">
          <img src="./assets/logo.png" alt="iBrew Logo" class="img" />
        </figure>

        <ul class="footer__links">
          <li><a href="/" class="text-tertiary">Home</a></li>
          <li>
            <a href="random-brewery.html" class="text-tertiary"
              >Random Brewery</a
            >
          </li>
          <li>
            <a href="search-breweries.html" class="text-tertiary"
              >Find Breweries</a
            >
          </li>
        </ul>

        <p class="text-tertiary">&copy; 2026 iBrew. All rights reserved.</p>
        <p class="text-tertiary">Created by Dylan Hua</p>
      </div>
    </footer>

    <script src="javascript/api/brewery.js"></script>
    <script src="javascript/map.js"></script>
    <script src="javascript/random-brewery.js"></script>
    <script>
      loadBrewery();
    </script>
  </body>
</html>
