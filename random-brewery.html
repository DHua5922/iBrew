<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicon -->
    <link rel="icon" href="./assets/favicon.ico" type="image/x-icon" />

    <!-- CSS -->
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/random-brewery.css" />

    <!-- Browser tab title -->
    <title>iBrew - Random Brewery</title>

    <!-- Font Awesome Icons -->
    <script
      src="https://kit.fontawesome.com/8700864f26.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <!-- Navigation Bar -->
    <nav aria-label="Primary navigation">
      <div class="nav__row">
        <a href="index.html" aria-label="iBrew home">
          <figure class="nav__logo--wrapper animate-slide-in-left">
            <img src="./assets/logo.png" alt="iBrew Logo" class="nav__logo" />
          </figure>
        </a>

        <!-- Navigation Links -->
        <ul class="nav__links align-items-center animate-slide-in-right">
          <li>
            <a href="index.html" class="link text-tertiary">Home</a>
          </li>
          <li>
            <a
              href="random-brewery.html"
              class="link text-tertiary"
              aria-current="page"
              >Random Brewery</a
            >
          </li>
          <li>
            <button
              class="btn-transparent js-theme-toggle"
              type="button"
              aria-label="Toggle dark mode"
              aria-pressed="false"
            >
              <i
                class="text-tertiary fa-solid fa-circle-half-stroke nav__theme-btn"
                aria-hidden="true"
              ></i>
            </button>
          </li>
          <li>
            <a
              href="search-breweries.html"
              class="link--primary btn btn-primary btn-primary-hover text-tertiary"
              >Find Breweries</a
            >
          </li>
        </ul>

        <button
          class="btn-transparent nav__menu-btn"
          type="button"
          aria-label="Open navigation menu"
          aria-expanded="false"
          aria-controls="mobile-navigation"
        >
          <i class="fa-solid fa-bars animate-slide-in-right" aria-hidden="true"></i>
        </button>
      </div>

      <!-- Collapsible Navigation Links -->
      <div class="nav__links--expandable" id="mobile-navigation">
        <ul class="nav__links--expandable-content">
          <li>
            <a href="index.html" class="link text-tertiary">Home</a>
          </li>
          <li>
            <a
              href="random-brewery.html"
              class="link text-tertiary"
              aria-current="page"
              >Random Brewery</a
            >
          </li>
          <li>
            <button
              class="btn-transparent js-theme-toggle"
              type="button"
              aria-label="Toggle dark mode"
              aria-pressed="false"
            >
              <i
                class="text-tertiary fa-solid fa-circle-half-stroke nav__theme-btn"
                aria-hidden="true"
              ></i>
            </button>
          </li>
          <li>
            <a
              href="search-breweries.html"
              class="link--primary btn btn-primary btn-primary-hover text-tertiary"
              >Find Breweries</a
            >
          </li>
        </ul>
      </div>
    </nav>

    <!-- Main Content -->
    <main>
      <section class="section" id="random-brewery-section">
        <h1 class="brewery__header animate-pop-in text-secondary">
          Try This Brewery!
        </h1>

        <div class="brewery__details row">
          <div
            class="animate-slide-in-left"
            id="map"
            role="region"
            aria-label="Brewery location map"
          ></div>
          <div
            class="brewery__description animate-slide-in-right"
            aria-live="polite"
          ></div>
        </div>

        <button
          class="brewery__button--refresh btn btn-primary animate-pop-in text-secondary"
          type="button"
        >
          Give Me Another Brewery
        </button>
      </section>
    </main>

    <!-- Footer -->
    <footer>
      <div class="footer__wrapper animate-pop-in">
        <a href="index.html" aria-label="iBrew home">
          <figure class="footer__logo--wrapper">
            <img src="./assets/logo.png" alt="" class="img" />
          </figure>
        </a>

        <ul class="footer__links">
          <li><a href="index.html" class="link text-tertiary">Home</a></li>
          <li>
            <a href="random-brewery.html" class="link text-tertiary"
              >Random Brewery</a
            >
          </li>
          <li>
            <a href="search-breweries.html" class="link text-tertiary"
              >Find Breweries</a
            >
          </li>
        </ul>

        <p class="text-tertiary">&copy; 2026 iBrew. All rights reserved.</p>
        <p class="text-tertiary">
          Created by
          <a
            class="text-tertiary"
            href="https://www.huadylan.com"
            target="_blank"
            rel="noopener noreferrer"
            >Dylan Hua</a
          >
        </p>
      </div>
    </footer>

    <!-- Scripts -->
    <script src="scripts/api/brewery.js"></script>
    <script src="scripts/utilities.js"></script>
    <script src="scripts/random-brewery.js"></script>
    <script src="scripts/map.js"></script>
  </body>
</html>
